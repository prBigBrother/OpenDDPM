name: Build and test
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: HomeKit tests
        run: npm ci --prefix homekit --ignore-scripts && node --test homekit/bridge.test.mjs
      - name: Core tests
        run: ./scripts/test.sh
      - name: Build universal app
        run: ./scripts/build.sh
      - name: Package
        run: ./scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: OpenDDPM-universal
          path: dist/*
